<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">BeforeShare — clean up before you share</title><desc id="desc">A local image editor with opaque redaction, annotations and PNG export.</desc>
<rect width="1200" height="360" rx="24" fill="#101827"/>
<circle cx="1080" cy="-20" r="250" fill="#192436"/><circle cx="1150" cy="340" r="180" fill="#202c3e"/>
<rect x="64" y="62" width="52" height="52" rx="13" fill="#f97316"/><rect x="74" y="76" width="32" height="23" rx="3" fill="#fff"/><path d="M80 83h20v9H80z" fill="#101827"/>
<text x="134" y="99" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">BEFORE YOU HIT SEND</text>
<text x="64" y="185" fill="#fff" font-family="Arial, sans-serif" font-size="66" font-weight="700">BeforeShare<tspan fill="#f97316">.</tspan></text>
<text x="66" y="231" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="25">Hide the private bits. Share the rest.</text>
<text x="66" y="298" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">LOCAL PROCESSING   /   NO IMAGE UPLOADS   /   FLAT PNG EXPORT</text>
